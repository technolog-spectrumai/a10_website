technology:
  title: Advanced Laser Beam Control
  text: 'ATEN focuses on the practical engineering stack behind laser direct energy: source stability, optical paths, beam shaping, feedback control, thermal regulation, and safe operating envelopes.'
  cards:
  - title: Directed Beam Delivery
    text: Precision optical alignment, focusing, and beam steering for controlled energy placement.
    icon: beam
  - title: Modular Architecture
    text: Interchangeable source, optics, cooling, and sensor modules for faster iteration.
    icon: grid
  - title: Closed-Loop Monitoring
    text: Continuous measurement of output, temperature, pointing stability, and system health.
    icon: clock
systems:
  title: Engineered for measurable laser performance
  text: 'ATEN systems are built around clarity: define the optical objective, control the energy path, measure performance, and make deployment repeatable.'
  bullets:
  - Power delivery and optical output characterized for each configuration.
  - Thermal management designed for stability under sustained operating cycles.
  - Software controls for diagnostics, calibration, and logged experiments.
  features:
  - title: Optical Precision
    text: High-quality optical assemblies support accurate pointing, focusing, and beam conditioning.
  - title: Thermal Stability
    text: Cooling and heat-transfer design help maintain predictable performance during extended use.
  - title: Control Software
    text: Operator interfaces provide test profiles, calibration flows, logs, alerts, and system status.
  - title: Safety Interlocks
    text: Layered operating controls support lab and industrial laser safety workflows.
applications:
  title: Applications for laser direct energy
  text: ATEN platforms are designed for teams that need controlled, measurable laser energy for demanding industrial and research workflows.
  cards:
  - kicker: Industrial
    title: Advanced materials processing
    text: High-intensity laser energy for controlled heating, surface treatment, joining research, and process validation.
  - kicker: Testing
    title: Component stress exposure
    text: Repeatable exposure profiles for evaluating coatings, sensors, thermal shields, and optical components.
  - kicker: Research
    title: Laboratory beam platforms
    text: Modular benches for beam shaping, power studies, detector calibration, and directed energy experiments.
  - kicker: Infrastructure
    title: Remote power concepts
    text: Exploration of precise energy transfer, optical links, and high-efficiency delivery architectures.
  - kicker: Optics
    title: Alignment and calibration
    text: Stable reference beams and diagnostic modules for optical payloads, fixtures, and high-accuracy assemblies.
  - kicker: Automation
    title: Machine-integrated laser cells
    text: Laser modules designed to connect with robotic positioning, sensors, and process-control software.
  - kicker: Energy
    title: High-flux energy studies
    text: Controlled flux delivery for experiments involving conversion efficiency, absorptivity, and thermal response.
  - kicker: Future
    title: Space-facing R&D
    text: Early research pathways for optical energy transfer, resilient payload testing, and orbital infrastructure concepts.
