space:
  eyebrow: Incoming research track
  title: Preparing laser systems for the space economy.
  p1: ATEN is positioning its laser direct energy platform toward space-relevant research, including optical power transfer concepts, payload exposure testing, thermal response studies, and precision beam control over extended distances.
  p2: The goal is to create reliable ground-test infrastructure first, then mature the controls, diagnostics, and safety architecture needed for future space-facing demonstrations.
mission:
  title: Built for serious engineering teams
  text: ATEN supports organizations developing high-intensity laser systems, controlled test environments, and advanced optical energy applications.
  cards:
  - title: Research & Development
    text: Prototype, instrument, and validate laser direct energy concepts with a modular platform.
  - title: Industrial Integration
    text: Adapt precision laser modules into process cells, test fixtures, and automation environments.
  - title: Specialized Platforms
    text: Configure optical, thermal, and control subsystems around specific project requirements.
